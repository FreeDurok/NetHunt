%YAML 1.1
---
default-log-dir: .
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            enabled: yes
        - http:
            enabled: yes
            extended: yes
        - dns:
            enabled: yes
        - tls:
            enabled: yes
        - files:
            enabled: yes
            force-magic: yes
            force-hash: [sha256]
        - smtp:
            enabled: yes
        - ssh:
            enabled: yes
        - flow:
            enabled: yes

file-store:
  enabled: yes
  log-dir: files
  force-filestore: yes
  force-hash: [sha256]
